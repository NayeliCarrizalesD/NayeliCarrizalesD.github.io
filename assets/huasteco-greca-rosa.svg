<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 30" width="100%" height="100%">
  <defs>
    <linearGradient id="gPinkElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3399" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="gPinkHot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66b2" />
      <stop offset="100%" stop-color="#ff1493" />
    </linearGradient>
  </defs>
  <!-- Guías pespunteadas de la orla tradicional -->
  <line x1="4" y1="3" x2="166" y2="3" stroke="#ff007f" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="2 2" />
  <line x1="4" y1="27" x2="166" y2="27" stroke="#ff007f" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="2 2" />
  
  <!-- Tallo continuo en zigzag de punto de cruz (Greca Huasteca Tének) -->
  <path d="M 6 15 L 18 10 L 30 15 L 42 20 L 54 15 L 66 10 L 78 15 L 90 20 L 102 15 L 114 10 L 126 15 L 138 20 L 150 15 L 164 10" 
        fill="none" stroke="#d80064" stroke-width="1.6" stroke-linecap="square" />

  <!-- 6 Flores Huastecas de 4 pétalos en punto de cruz -->
  <g transform="translate(18, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkElectric)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkElectric)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>
  <g transform="translate(46, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkHot)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkHot)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>
  <g transform="translate(74, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkElectric)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkElectric)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>
  <g transform="translate(102, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkHot)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkHot)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>
  <g transform="translate(130, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkElectric)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkElectric)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>
  <g transform="translate(156, 15)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" />
    <polygon points="0,-6 4,-3 0,0 -4,-3" fill="url(#gPinkHot)" />
    <polygon points="0,6 4,3 0,0 -4,3" fill="url(#gPinkHot)" />
    <polygon points="-6,0 -3,-4 0,0 -3,4" fill="#ff007f" />
    <polygon points="6,0 3,-4 0,0 3,4" fill="#ff007f" />
  </g>

  <!-- Ramitas de estambre (Hojas en punto de cruz) -->
  <circle cx="32" cy="9" r="1.5" fill="#ff99cc" />
  <circle cx="32" cy="21" r="1.5" fill="#ff99cc" />
  <circle cx="60" cy="9" r="1.5" fill="#ff99cc" />
  <circle cx="60" cy="21" r="1.5" fill="#ff99cc" />
  <circle cx="88" cy="9" r="1.5" fill="#ff99cc" />
  <circle cx="88" cy="21" r="1.5" fill="#ff99cc" />
  <circle cx="116" cy="9" r="1.5" fill="#ff99cc" />
  <circle cx="116" cy="21" r="1.5" fill="#ff99cc" />
  <circle cx="144" cy="9" r="1.5" fill="#ff99cc" />
  <circle cx="144" cy="21" r="1.5" fill="#ff99cc" />
</svg>
