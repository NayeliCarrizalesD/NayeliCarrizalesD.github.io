<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
  <defs>
    <linearGradient id="ePinkElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3399" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="ePinkHot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66b2" />
      <stop offset="100%" stop-color="#ff1493" />
    </linearGradient>
    <linearGradient id="ePinkBlush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff66b2" />
    </linearGradient>
  </defs>

  <g transform="translate(30, 30)">
    <!-- Punto central blanco -->
    <rect x="-2" y="-2" width="4" height="4" fill="#ffffff" />

    <!-- 4 Brazos Cardinales Escalonados en Punto de Cruz -->
    <g id="armCardinal">
      <polygon points="0,-5 4,-10 6,-15 0,-24 -6,-15 -4,-10" fill="url(#ePinkElectric)" stroke="#d80064" stroke-width="1" />
      <polygon points="0,-9 3,-13 0,-18 -3,-13" fill="url(#ePinkBlush)" />
      <rect x="-1.5" y="-14" width="3" height="3" fill="#ffffff" />
      <!-- Satélites de punto de cruz -->
      <polygon points="4,-14 8,-14 6,-10" fill="#ff007f" />
      <polygon points="-4,-14 -8,-14 -6,-10" fill="#ff007f" />
      <circle cx="0" cy="-26" r="1.5" fill="#ff66b2" />
    </g>
    <use href="#armCardinal" transform="rotate(90)" />
    <use href="#armCardinal" transform="rotate(180)" />
    <use href="#armCardinal" transform="rotate(270)" />

    <!-- 4 Brazos Diagonales de Rombos Escalonados -->
    <g id="armDiagonal" transform="rotate(45)">
      <polygon points="0,-5 5,-11 0,-19 -5,-11" fill="url(#ePinkHot)" stroke="#ff007f" stroke-width="0.8" />
      <circle cx="0" cy="-11" r="1.5" fill="#ffffff" />
      <polygon points="0,-20 3,-24 0,-27 -3,-24" fill="#ffb3d9" />
    </g>
    <use href="#armDiagonal" transform="rotate(90)" />
    <use href="#armDiagonal" transform="rotate(180)" />
    <use href="#armDiagonal" transform="rotate(270)" />
  </g>
</svg>
