<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circular glow disk -->
  <circle cx="50" cy="50" r="46" fill="#0d0614" />
  
  <g filter="url(#neonGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Octagonal guide ring -->
    <polygon points="50,22 69,28 78,50 69,72 50,78 31,72 22,50 31,28" 
             fill="none" stroke="#ff7a00" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8" />
             
    <!-- 4 Diagonal Petals -->
    <path d="M44 44 C38 38, 29 29, 23 23 C31 21, 40 32, 44 44 Z" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="2.2" />
    <path d="M56 44 C62 38, 71 29, 77 23 C69 21, 60 32, 56 44 Z" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="2.2" />
    <path d="M44 56 C38 62, 29 71, 23 77 C31 79, 40 68, 44 56 Z" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="2.2" />
    <path d="M56 56 C62 62, 71 71, 77 77 C69 79, 60 68, 56 56 Z" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="2.2" />
    
    <!-- 4 Cardinal Petals -->
    <path d="M50 42 C45 31, 44 20, 50 11 C56 20, 55 31, 50 42 Z" fill="rgba(255, 122, 0, 0.25)" stroke="#ff7a00" stroke-width="2.6" />
    <path d="M50 58 C45 69, 44 80, 50 89 C56 80, 55 69, 50 58 Z" fill="rgba(255, 122, 0, 0.25)" stroke="#ff7a00" stroke-width="2.6" />
    <path d="M42 50 C31 45, 20 44, 11 50 C20 56, 31 55, 42 50 Z" fill="rgba(255, 122, 0, 0.25)" stroke="#ff7a00" stroke-width="2.6" />
    <path d="M58 50 C69 45, 80 44, 89 50 C80 56, 69 55, 58 50 Z" fill="rgba(255, 122, 0, 0.25)" stroke="#ff7a00" stroke-width="2.6" />

    <!-- Center Diamond Core -->
    <polygon points="50,42 58,50 50,58 42,50" fill="#200a26" stroke="#ff007f" stroke-width="2.4" />
    <circle cx="50" cy="50" r="3.2" fill="#ff7a00" />
    <circle cx="50" cy="50" r="1.5" fill="#fff" />
  </g>
</svg>
